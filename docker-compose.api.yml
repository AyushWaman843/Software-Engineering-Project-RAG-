# API-only stack for Cloudflare Tunnel (no Next.js web container).
# Usage: docker compose -f docker-compose.api.yml up --build -d
#
# Then expose port 5000 with cloudflared (https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      PORT: "5000"
      GUNICORN_TIMEOUT: "600"
    volumes:
      - scanner_data:/data
    ports:
      # Localhost only — Cloudflare Tunnel connects here; not open to your LAN.
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  scanner_data:
