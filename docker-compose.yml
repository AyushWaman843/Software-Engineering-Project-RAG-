services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      PORT: "5000"
    volumes:
      - scanner_data:/data
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BACKEND_URL: http://api:5000
      INTERNAL_API_KEY: ${API_KEY}
      APP_PASSWORD: ${APP_PASSWORD}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  scanner_data:
